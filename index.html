<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json" crossorigin="use-credentials" />
    <link rel="stylesheet" href="./styles.css">
    <title>Worker server example</title>
  </head>
  <body>
    <h1>JavaScript worker server example</h1>
    <input type="number" size="10" value="0" id="num1">
    <select name="calculation" id="arithmeticSymbol">
        <option value="+">+ added to</option>
        <option value="-">- subtracted by</option>
        <option value="*">* multiplied by</option>
        <option value="/">/ divide by</option>
    </select>
    <input type="number" size="10" value="0" id="num2">
    <button id="calculate">Calculate!</button>
    <h2>Result</h2>
    <div id="result">
      <p>Here comes the result</p>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
